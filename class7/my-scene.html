<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>杭州三维场景 - 环境阶段</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #b9dce8;
    }

    canvas {
      display: block;
    }
  </style>
</head>
<body>
  <script src="./libs/three.min.js"></script>
  <script src="./libs/OrbitControls.js"></script>
  <script>
    // 杭州场景环境：先完成天空色、雾、地面、相机、光源和轨道控制。
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0xb9dce8);
    scene.fog = new THREE.Fog(0xb9dce8, 12, 30);

    const camera = new THREE.PerspectiveCamera(
      45,
      window.innerWidth / window.innerHeight,
      0.1,
      100
    );
    camera.position.set(7, 5, 9);
    camera.lookAt(0, 0, 0);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    // 环境光提供基础亮度，方向光模拟杭州午后的太阳光。
    scene.add(new THREE.HemisphereLight(0xe8f7ff, 0x6d8f86, 1.2));
    const sunlight = new THREE.DirectionalLight(0xfff1cf, 1.6);
    sunlight.position.set(-6, 10, 5);
    scene.add(sunlight);

    // 地面是后续杭州主题元素的承载环境，暂不添加主题主体。
    const ground = new THREE.Mesh(
      new THREE.PlaneGeometry(40, 40),
      new THREE.MeshStandardMaterial({
        color: 0x789b78,
        roughness: 1
      })
    );
    ground.rotation.x = -Math.PI / 2;
    ground.position.y = -0.5;
    scene.add(ground);

    // 杭州主题主体：用简单几何体表现“西湖、远山、雷峰塔和桥”。
    const lake = new THREE.Mesh(
      new THREE.CircleGeometry(5.5, 48),
      new THREE.MeshStandardMaterial({
        color: 0x4d9db0,
        roughness: 0.35,
        metalness: 0.05
      })
    );
    lake.rotation.x = -Math.PI / 2;
    lake.position.set(0, -0.46, 1.6);
    lake.scale.set(1.25, 0.65, 1);
    scene.add(lake);

    // 远山：三个低矮圆锥体，放在场景后方。
    const mountainMaterial = new THREE.MeshStandardMaterial({ color: 0x547b63 });
    [-5, 0, 5].forEach((x, index) => {
      const mountain = new THREE.Mesh(
        new THREE.ConeGeometry(2.4, 3.2 + index * 0.35, 5),
        mountainMaterial
      );
      mountain.position.set(x, 1.05, -5.5);
      scene.add(mountain);
    });

    // 简化版雷峰塔：方柱塔身 + 三层屋顶。
    const pagoda = new THREE.Group();
    const towerMaterial = new THREE.MeshStandardMaterial({ color: 0xd4864d });
    const roofMaterial = new THREE.MeshStandardMaterial({ color: 0x394b40 });

    const towerBody = new THREE.Mesh(
      new THREE.BoxGeometry(1.15, 3.4, 1.15),
      towerMaterial
    );
    towerBody.position.y = 1.25;
    pagoda.add(towerBody);

    [2.9, 2.0, 1.1].forEach((y, index) => {
      const roof = new THREE.Mesh(
        new THREE.ConeGeometry(1.15 - index * 0.2, 0.35, 4),
        roofMaterial
      );
      roof.rotation.y = Math.PI / 4;
      roof.position.y = y;
      pagoda.add(roof);
    });
    pagoda.position.set(3.5, 0, 0.1);
    scene.add(pagoda);

    // 简单拱桥：桥面和两侧桥栏，横跨湖面前方。
    const bridge = new THREE.Group();
    const bridgeMaterial = new THREE.MeshStandardMaterial({ color: 0xe5c58b });
    const bridgeDeck = new THREE.Mesh(
      new THREE.BoxGeometry(5, 0.3, 0.8),
      bridgeMaterial
    );
    bridgeDeck.position.y = 0.05;
    bridge.add(bridgeDeck);

    [-2, -1, 0, 1, 2].forEach((x) => {
      const post = new THREE.Mesh(
        new THREE.CylinderGeometry(0.08, 0.08, 0.75, 8),
        bridgeMaterial
      );
      post.position.set(x, 0.45, -0.3);
      bridge.add(post);
    });
    bridge.position.set(-0.5, 0, 2.2);
    bridge.rotation.y = -0.1;
    scene.add(bridge);

    // 轨道控制器：支持鼠标拖拽旋转和滚轮缩放。
    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.target.set(0, 0, 0);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.minDistance = 4;
    controls.maxDistance = 20;
    controls.maxPolarAngle = Math.PI / 2.05;
    controls.update();

    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
