<!doctype html>
<html lang="zh-CN">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="description" content="诗画杭州 · 城市探索与行程助手" />
  <title>我的行程｜诗画杭州</title>
  <link rel="icon" href="images/logo.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="libs/bootstrap-5.3.3.min.css" />
  <link rel="stylesheet" href="css/common.css" />
  <link rel="stylesheet" href="css/planner.css" />
</head>

<body>
  <a class="skip-link" href="#main-content">跳到主要内容</a>
  <header class="site-header">
    <div class="container nav-wrap">
      <a class="brand" href="index.html">
        <img src="images/logo.svg" class="brand-icon" alt="" width="36" height="36" />诗画杭州
      </a>
      <button class="menu-button" aria-expanded="false" aria-controls="site-nav">
        菜单
      </button>
      <nav id="site-nav" aria-label="主导航">
        <a href="index.html">首页</a>
        <a href="explore.html">景点探索</a>
        <a href="planner.html" class="is-current" aria-current="page">我的行程</a>
        <a href="dashboard.html">数据看板</a>
        <a href="scene.html">三维展示</a>
      </nav>
    </div>
  </header>
  <div class="container">
    <p id="storage-status" class="notice" role="status" hidden></p>
    <p id="action-status" role="status" aria-live="polite"></p>
  </div>
  <main id="main-content">
    <section class="section container">
      <div class="section-heading-row">
        <div>
          <p class="eyebrow">收藏与费用记录</p>
          <h1>我的行程</h1>
          <p>个人顺序清单，不提供路线优化或耗时保证。</p>
        </div>
        <div class="actions">
          <button id="export-button" class="button secondary">
            导出 JSON
          </button>
          <button id="print-button" class="button primary">打印行程</button>
        </div>
      </div>
      <p id="planner-status" role="status"></p>
      <div class="row row-cols-1 row-cols-lg-2 g-3 mt-1">
        <div class="col">
          <section class="panel">
            <h2>我的一日行程</h2>
            <label>参考客流月份<select id="travel-month"></select> </label>
            <p class="muted">
              选择月份后，可在数据看板查看对应的课堂模拟客流。
            </p>
            <ol id="itinerary-list" class="record-list"></ol>
            <a href="explore.html">继续挑选景点</a>
          </section>
        </div>
        <div class="col">
          <section class="panel">
            <h2>预算与消费</h2>
            <form id="budget-form" class="inline-form">
              <label>预算上限（元）<input id="budget-input" inputmode="decimal" required />
              </label>
              <button class="button secondary">保存预算</button>
            </form>
            <div id="budget-summary" class="summary"></div>
            <form id="expense-form" class="form-grid">
              <label>项目名称<input id="expense-label" maxlength="40" required placeholder="例如：西湖游船" />
              </label>
              <label>金额（元）<input id="expense-amount" inputmode="decimal" required placeholder="最多两位小数" />
              </label>
              <label>类别<select id="expense-category">
                  <option>交通</option>
                  <option>门票</option>
                  <option>餐饮</option>
                  <option>其他</option>
                </select>
              </label>
              <label>关联景点<select id="expense-place"></select> </label>
              <button class="button primary">添加费用</button>
              <button type="button" id="load-costs" class="quiet">
                载入五条课堂样例
              </button>
            </form>
            <p id="budget-message" role="status"></p>
            <ul id="expense-list" class="record-list"></ul>
          </section>
        </div>
      </div>
      <section class="panel section-space">
        <h2>我的收藏</h2>
        <div id="favorites-list" class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-3"></div>
      </section>
    </section>
  </main>
  <footer class="site-footer">
    <div class="container">
      <strong>诗画杭州</strong>
      <p>前端期末大作业 · 信息与数据展示中心</p>
    </div>
  </footer>
  <script src="libs/jquery-3.7.1.min.js"></script>
  <script src="js/app.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/places.js"></script>
  <script src="js/planner.js"></script>
</body>

</html>
