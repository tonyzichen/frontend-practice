<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>题目一：流式排版</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: "Microsoft YaHei", Arial, sans-serif;
      background: #f4f4f4;
      color: #333;
    }
    /* ===== 导航 ===== */
    .header {
      background: #4caf50;
      padding: 12px 20px;
    }
    .header h1 {
      color: #fff;
      /* 原来固定写法：font-size: 20px;
         改为 clamp(下限, 首选值, 上限)：最小18px，首选3vw，最大26px */
      font-size: clamp(18px, 3vw, 26px);
    }

    /* ===== 横幅 ===== */
    .banner {
      background: #e8f5e9;
      text-align: center;
      /* min()：上下内边距取 6vw 和 48px 中较小的那个 */
      padding: min(6vw, 48px) 16px;
      margin-bottom: 20px;
    }
    .banner h2 {
      color: #2e7d32;
      font-size: clamp(24px, 5vw, 40px);
      margin-bottom: 10px;
    }
    .banner p {
      color: #555;
      font-size: clamp(14px, 2vw, 18px);
    }

    /* ===== 卡片 ===== */
    .section {
      max-width: 1000px;
      margin: 0 auto 30px;
      padding: 0 16px;
    }
    .section h2 {
      text-align: center;
      color: #2e7d32;
      margin-bottom: 20px;
      font-size: 22px;
    }
    .card-list {
      display: grid;
      grid-template-columns: 1fr;
      gap: 16px;
    }
    .card {
      background: #fff;
      border: 1px solid #ddd;
      border-radius: 6px;
      padding: 16px;
    }
    .card h3 {
      color: #2e7d32;
      margin-bottom: 6px;
      font-size: 18px;
    }
    .card p {
      font-size: 14px;
      color: #666;
      line-height: 1.6;
    }

    @media (min-width: 768px) {
      .card-list { grid-template-columns: repeat(2, 1fr); }
    }
    @media (min-width: 1024px) {
      .card-list { grid-template-columns: repeat(3, 1fr); }
    }
  </style>
</head>
<body>

  <header class="header">
    <h1>诗画杭州</h1>
  </header>

  <div class="banner">
    <h2>上有天堂，下有杭州</h2>
    <p>三面云山一面城，一湖碧水映千年</p>
  </div>

  <main>
    <section class="section">
      <h2>西湖胜景</h2>
      <div class="card-list">
        <div class="card">
          <h3>西湖</h3>
          <p>三面云山一面城，苏堤白堤横贯碧波，十景之首的柔波塔影。</p>
        </div>
        <div class="card">
          <h3>灵隐寺</h3>
          <p>东晋古刹，飞来峰造像与千年香火，禅意与山林相融。</p>
        </div>
        <div class="card">
          <h3>雷峰塔</h3>
          <p>因白娘子传说闻名天下，夕照之下塔影横斜，金光满湖。</p>
        </div>
      </div>
    </section>
  </main>


</body>
</html>
