<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="诗画杭州：热门景点客流量对比与月度走势图表，还有一屏可以旋转缩放的三维西湖夜景。">
  <title>诗画杭州｜数据看板</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='18' fill='%232d7783'/%3E%3Ctext x='32' y='45' font-size='38' text-anchor='middle' fill='white'%3E%E6%9D%AD%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <a class="skip-link" href="#main-content">跳到主要内容</a>

  <header class="site-header">
    <div class="container nav-wrap">
      <a class="brand" href="index.html" aria-label="诗画杭州首页">
        <span class="brand-mark" aria-hidden="true">杭</span>
        <span>诗画杭州</span>
      </a>
      <button class="menu-button" type="button" aria-expanded="false" aria-controls="site-nav">
        <span class="menu-icon" aria-hidden="true"></span>
        <span class="sr-only">展开导航</span>
      </button>
      <nav id="site-nav" class="site-nav" aria-label="主导航">
        <a href="index.html">首页</a>
        <a href="index.html#city">城市印象</a>
        <a href="index.html#places">精选景点</a>
        <a href="explore.html">景点探索</a>
        <a class="is-current" href="dashboard.html" aria-current="page">数据看板</a>
      </nav>
    </div>
  </header>

  <main id="main-content">
    <section class="section" aria-labelledby="dashboard-title">
      <div class="container">
        <div class="section-heading">
          <p class="eyebrow">VISITOR INSIGHTS</p>
          <h1 id="dashboard-title">客流观察</h1>
          <p>哪些景点人气最旺、什么时节出行人最少，两张图帮你快速看清。出行前看一眼，避开人潮从容安排行程。</p>
        </div>

        <p id="dashboard-status" class="eyebrow" aria-live="polite">正在加载客流数据…</p>

        <div id="stat-cards" class="info-grid"></div>

        <div class="info-card" style="margin-top: 1rem;">
          <div id="spot-chart" role="img" aria-label="热门景点年客流量柱状图" style="height: 380px;"></div>
        </div>

        <div class="info-card" style="margin-top: 1rem;">
          <div id="trend-chart" role="img" aria-label="主要景区月度客流走势折线图" style="height: 380px;"></div>
        </div>

        <p id="chart-source" class="eyebrow"></p>
      </div>
    </section>

    <section class="section" aria-labelledby="scene-title">
      <div class="container">
        <div class="section-heading">
          <p class="eyebrow">WEST LAKE IN 3D</p>
          <h2 id="scene-title">三维西湖</h2>
          <p>拖动旋转视角，滚轮缩放远近：入夜后的湖面、远山、雷峰塔与一叶夜游的小船，构成西湖最经典的剪影。</p>
        </div>
        <div id="westlake-scene" class="info-card" style="height: 460px; padding: 0; overflow: hidden;"></div>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>诗画杭州 · 城市探索与行程助手</p>
    </div>
  </footer>

  <script src="libs/echarts.min.js"></script>
  <script src="libs/three.min.js"></script>
  <script src="libs/OrbitControls.js"></script>
  <script src="js/app.js"></script>
  <script src="js/dashboard.js"></script>
</body>
</html>
