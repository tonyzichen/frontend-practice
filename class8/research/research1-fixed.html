<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <title>可访问性审查实验</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      width: 700px;
      margin: 40px auto;
      line-height: 1.8;
    }

    .tip {
      color: #bbbbbb;
      background-color: white;
    }

    a {
      color: #0066cc;
      text-decoration: none;
    }

    img {
      width: 300px;
      height: 160px;
    }

    input {
      padding: 8px;
    }

    button {
      padding: 8px 15px;
      margin-left: 5px;
    }
  </style>
</head>

<body>

  <h1>杭州旅游信息查询</h1>

  <p class="tip">
    输入景点名称，可以查询相关旅游信息。
  </p>

  <img src="test.jpg" alt="杭州风景示意图">

  <h2>景点查询</h2>

  <label for="keyword">景点名称：</label>

  <input
    type="text"
    id="keyword"
    placeholder="请输入景点名称">

  <button aria-label="搜索景点">
    <span aria-hidden="true">🔍</span>
  </button>

  <p>
    你也可以访问
    <a href="https://www.hangzhou.gov.cn/">杭州官方网站</a>
    查看更多信息。
  </p>

</body>
</html>
