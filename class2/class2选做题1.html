<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>纯CSS表单状态研究</title>
<style>
  form { max-width: 300px; margin: 0 auto;  }
  
  input {
    width: 100%;
    height: 40px;
    margin-bottom: 20px;
    border: 2px solid #ddd;
    font-size: 16px;
  }

  /* 聚焦时高亮 (:focus) */
  input:focus {
    border-color: #4a90e2;
  }

  /* 针对required属性生效，格式错误时红框 (属性选择器 + :invalid) */
  input[required]:invalid {
    border-color: #e74c3c;
    background-color: #fff5f5;
  }

  /* 3. 必填项填写正确时绿框 (:valid + 属性选择器) */
  input[required]:valid {
    border-color: #2ecc71;
  }
</style>
</head>
<body>

<form>
  <!-- 必填项：不填或格式错误显示红框，填对显示绿框 -->
 用户名：  <input type="text" required placeholder="必填：用户名">
 邮箱： <input type="email" required placeholder="必填：邮箱">
  
  <!-- 选填项：不会触发上面的红绿框逻辑 -->
 昵称： <input type="text" placeholder="选填：昵称">
</form>

</body>
</html>
