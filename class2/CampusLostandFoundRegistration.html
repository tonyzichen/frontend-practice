<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>校园失物招领登记</title>
    <!-- 引入外部CSS文件 -->
    <link rel="stylesheet" href="style2.css">
</head>
<body>
    <!-- 1. 语义化结构：header -->
    <header>
        <h1>校园失物招领登记系统</h1>
        <nav>
            <ul>
                <li><a href="#">首页</a></li>
                <li><a href="#">失物登记</a></li>
                <li><a href="#">招领公告</a></li>
                <li><a href="#">联系我们</a></li>
            </ul>
        </nav>
    </header>

    <!-- 2. 语义化结构：main 和 section -->
    <main>
        <section class="intro-section">
            <h2>物品丢失或拾获？请在此登记</h2>
            <p>欢迎使用校园失物招领系统。如果您在校园内拾获他人遗失的物品，或不幸丢失了个人物品，请如实填写以下表单。我们将尽快协助您找回物品或归还失主。带 <span class="required">*</span> 的为必填项。</p>
        </section>

        <section class="form-section">
            <form action="#" method="post">
                <!-- 控件1：text + required -->
                <div class="form-group">
                    <label for="username">拾获人/失主姓名 <span class="required">*</span></label>
                    <input type="text" id="username" name="username" placeholder="请输入您的真实姓名" required>
                </div>

                <!-- 控件2：tel + pattern (校验属性) -->
                <div class="form-group">
                    <label for="phone">联系电话 <span class="required">*</span></label>
                    <input type="tel" id="phone" name="phone" placeholder="请输入11位手机号码" pattern="^1[3-9]\d{9}$" required>
                </div>

                <!-- 控件3：email -->
                <div class="form-group">
                    <label for="email">电子邮箱</label>
                    <input type="email" id="email" name="email" placeholder="example@university.edu.cn">
                </div>

                <!-- 控件4：radio -->
                <div class="form-group">
                    <label>操作类型 <span class="required">*</span></label>
                    <div class="radio-group">
                        <label for="type-lost"><input type="radio" id="type-lost" name="action_type" value="lost" required> 我丢失了物品</label>
                        <label for="type-found"><input type="radio" id="type-found" name="action_type" value="found"> 我拾获了物品</label>
                    </div>
                </div>

                <!-- 控件5：select -->
                <div class="form-group">
                    <label for="category">物品类别 <span class="required">*</span></label>
                    <select id="category" name="category" required>
                        <option value="">-- 请选择物品类别 --</option>
                        <option value="electronics">电子产品 (如手机、电脑、U盘)</option>
                        <option value="cards">证件卡片 (如校园卡、身份证)</option>
                        <option value="keys">钥匙</option>
                        <option value="clothes">衣物配饰</option>
                        <option value="books">书籍文具</option>
                        <option value="other">其他</option>
                    </select>
                </div>

                <!-- 控件6：date -->
                <div class="form-group">
                    <label for="lost-date">丢失/拾获日期 <span class="required">*</span></label>
                    <input type="date" id="lost-date" name="lost_date" required>
                </div>

                <!-- 控件7：file -->
                <div class="form-group">
                    <label for="item-photo">物品照片</label>
                    <input type="file" id="item-photo" name="item_photo" accept="image/*">
                </div>

                <!-- 控件8：textarea + maxlength (校验属性) -->
                <div class="form-group">
                    <label for="description">物品详细描述 <span class="required">*</span></label>
                    <textarea id="description" name="description" rows="4" maxlength="200" placeholder="请描述物品的特征、颜色、丢失/拾获的具体地点等" required></textarea>
                    <small>最多可输入200个字符</small>
                </div>

                <!-- 控件9：checkbox -->
                <div class="form-group checkbox-group">
                    <label for="agree">
                        <input type="checkbox" id="agree" name="agreement" required> 
                        我已阅读并同意《校园失物招领平台用户协议》 <span class="required">*</span>
                    </label>
                </div>

                <!-- 提交按钮 -->
                <div class="form-group">
                    <button type="submit">提交登记</button>
                </div>
            </form>

        </section>
        
    </main>
    

    <!-- 3. 语义化结构：footer -->
    <footer>
        <p>  校园失物招领登记系统 </p>
    </footer>
</body>
</html>
