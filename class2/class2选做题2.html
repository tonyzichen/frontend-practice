<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <title>FiledSet和Legend研究</title>

  <style>

    body {
      padding: 20px;
    }

    form {
      width: 400px;
      margin: 0 auto;
    }

    input {
      width: 280px;
    }

  </style>
</head>

<body>

  <form>
    <fieldset>
      <legend>家庭地址</legend>

      <label for="city">城市</label>
      <input type="text" id="city1" name="city1">
      <br>
      <label for="street1">街道</label>
      <input type="text" id="street1" name="street1">
    </fieldset>

    <fieldset>
      <legend>工作地址</legend>

      <label for="city2">城市</label>
      <input type="text" id="city2" name="city2 ">
      <br>
      <label for="street2">街道</label>
      <input type="text" id="street2" name="street2">
    </fieldset>
  </form>

</body>

</html>
