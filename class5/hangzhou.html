<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>杭州地点收藏</title>

</head>
<body>
  <h1>杭州地点收藏</h1>
  <p class="subtitle">记录我想去和已经去过的杭州好地方。</p>

  <form id="place-form">
    <div class="form-grid">
      <label>地点名称<input id="place-name" type="text" placeholder="例如：西湖断桥"></label>
      <label>所在区域<input id="place-area" type="text" placeholder="例如：西湖区"></label>
      <label>地点类型<select id="place-type"><option>自然风光</option><option>人文古迹</option><option>美食探店</option><option>城市漫步</option></select></label>
      <label>个人评分<input id="place-rating" type="number" min="0" max="5" step="0.1" placeholder="例如：4.8"></label>
    </div>
    <button type="submit">添加地点</button>
    <p id="tip" class="tip" role="alert"></p>
  </form>

  <section class="list-panel">
    <h2>我的杭州清单</h2>
    <table>
      <thead><tr><th>地点</th><th>区域</th><th>类型</th><th>评分</th></tr></thead>
      <tbody id="place-list"></tbody>
    </table>
  </section>

  <script src="hangzhou.js"></script>
</body>
</html>
